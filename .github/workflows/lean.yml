name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned dependencies and mathlib cache
        run: lake exe cache get
      - name: Build all modules and audit axioms
        run: python3 scripts/verify.py
      - name: Preserve verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-verification
          path: |
            build.log
            verification.log
            verification.json
          if-no-files-found: ignore
